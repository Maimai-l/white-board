<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速写</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #f2f2f7; --panel: #ffffff; --text: #1c1c1e; --muted: #8e8e93; --line: #d1d1d6;
    --accent: #3a62d7; --accent-text: #ffffff; --danger: #c4372b; --ok: #34c759;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --panel: #2c2c2e; --text: #f2f2f7; --muted: #8e8e93; --line: #3a3a3c; --accent: #6b8cff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-size: 13px; }
  #pad { position: relative; flex: 1; min-height: 120px; margin: 8px 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  footer { display: flex; align-items: center; gap: 8px; padding: 8px; }
  #status { flex: 1; width: 8px; height: 8px; }
  #status::before { content: ""; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status[data-state="online"]::before { background: var(--ok); }
  #status[data-state="offline"]::before { background: var(--danger); }
  button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  /* 提示浮在画布底部，几秒后消失 */
  #notice { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: calc(100% - 32px); margin: 0;
            padding: 5px 10px; border-radius: 8px; background: rgba(28, 28, 30, .86); color: #fff; font-size: 12px; line-height: 1.4;
            text-align: center; pointer-events: none; }
  #notice:empty { display: none; }
  #notice[data-kind="error"] { background: var(--danger); }
</style>
</head>
<body>
  <div id="pad"></div>
  <footer>
    <span id="status" title="连接中" aria-label="连接中"></span>
    <button id="clear" disabled>清空</button>
    <button id="copy" class="primary" disabled title="复制为 PNG 图片（⌘C）">复制</button>
  </footer>
  <p id="notice" role="status"></p>
  <script type="module" src="/static/js/sketch.js"></script>
</body>
</html>
