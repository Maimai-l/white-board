name: 装好 Python 测试依赖
description: setup-python（带 pip 缓存）+ 锁文件 requirements-test.lock。浏览器测试不用它，用 .github/actions/playwright

inputs:
  python-version:
    description: Python 版本
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-test.lock

    - name: 装测试依赖
      shell: bash
      run: python -m pip install --require-hashes -r requirements-test.lock
