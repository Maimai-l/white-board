name: CI

# 一个 workflow，按改动挑 job（docs/design/ci-and-updates.zh-CN.md 第 2 节）。
# 跑哪些由 plan 决定（tools/ci_plan.py）：只改文档只跑 checks；推到 dev 或推 tag 全部跑，
# 全部通过后发布 Sparkle 更新（dev → alpha，tag → stable）；其余分支只演练发布。
# 手动运行可以指定 job；提交说明里写 [ci: e2e,webkit] 或 [ci: all] 也可以。
on:
  push:
    branches: [dev, "claude/**"]
    tags: ["v*"]
  # 不监听 pull_request：PR 都来自本仓库的 claude/** 分支，push 那次运行已经覆盖，检查结果也显示在
  # PR 上。两个事件都监听时，同一个提交跑两遍（并发组不同，互不取消），macOS 机器要排两份队
  workflow_dispatch:
    inputs:
      jobs:
        description: 要跑的 job，逗号分隔（checks,unit,e2e,webkit,js,inksync,ipad,package,extension），或 all
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

# 显式写 bash，GitHub 才会加上 -o pipefail：否则「脚本 | tee」里脚本失败了，这一步照样是绿的
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      unit: ${{ steps.plan.outputs.unit }}
      e2e: ${{ steps.plan.outputs.e2e }}
      webkit: ${{ steps.plan.outputs.webkit }}
      js: ${{ steps.plan.outputs.js }}
      inksync: ${{ steps.plan.outputs.inksync }}
      ipad: ${{ steps.plan.outputs.ipad }}
      package: ${{ steps.plan.outputs.package }}
      extension: ${{ steps.plan.outputs.extension }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      marketing: ${{ steps.plan.outputs.marketing }}
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      site: ${{ steps.plan.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 决定跑哪些 job
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          JOBS_INPUT: ${{ github.event.inputs.jobs }}
        run: python3 tools/ci_plan.py

  checks:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 提交说明的检查要看到这次推送的每个提交
      - uses: ./.github/actions/setup-python-deps
      - run: make checks PY=python

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - run: make unit PY=python
      - name: 摘要
        if: always()
        run: python tools/ci_summary.py "单元测试" reports/unit.xml >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    # 浏览器和系统依赖来自 Playwright 的镜像：GitHub 机器上 apt 只有 60–220 kB/s，
    # WebKit 的 126 MB 依赖装不完。make 在机器上跑，pytest 在容器里跑
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/playwright
        id: pw
      - run: make e2e PY="${{ steps.pw.outputs.py }}"
      - name: 摘要
        if: always()
        run: python3 tools/ci_summary.py "端到端（Chromium）" reports/e2e.xml >> "$GITHUB_STEP_SUMMARY"
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: test-results/
          if-no-files-found: ignore
      # 界面各个状态的截图（tests/e2e/test_ui_states.py），过没过都传，改界面之后可以直接翻看
      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-states
          path: test-results/ui-states/
          if-no-files-found: ignore

  # iPad 上的 Safari 是 WebKit：主要流程用 WebKit 再跑一遍（用例列表在 Makefile 的 WEBKIT_CASES）
  webkit:
    needs: plan
    if: needs.plan.outputs.webkit == 'true'
    # 浏览器和系统依赖来自 Playwright 的镜像：GitHub 机器上 apt 只有 60–220 kB/s，
    # WebKit 的 126 MB 依赖装不完。make 在机器上跑，pytest 在容器里跑
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/playwright
        id: pw
      - run: make webkit PY="${{ steps.pw.outputs.py }}"
      - name: 摘要
        if: always()
        run: python3 tools/ci_summary.py "端到端（WebKit）" reports/webkit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit
          path: test-results/
          if-no-files-found: ignore

  # 前端的纯计算（笔画几何、橡皮曲线、压感），不开浏览器
  js:
    needs: plan
    if: needs.plan.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make js

  # inksync 单独安装、单独测试：不装白板应用，确认包没有依赖它
  inksync:
    needs: plan
    if: needs.plan.outputs.inksync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packages/inksync/pyproject.toml
      - run: python -m pip install ./packages/inksync pytest
      - run: make inksync PY=python
      - name: 摘要
        if: always()
        run: python tools/ci_summary.py "inksync" reports/inksync.xml >> "$GITHUB_STEP_SUMMARY"

  # iPad 外壳（docs/ipad-shell.md 8.1 节）：不签名编译，ldid 伪签名，打成 IPA。
  # 版本号与 Mac 端相同；package 要把它放进应用里。
  # 只改了 iPad 外壳、没有打包的时候单独编译；要打包时由 package 一起编译（省一次 macOS 排队）
  ipad:
    needs: plan
    if: needs.plan.outputs.ipad == 'true' && needs.plan.outputs.package != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ipad-shell
        with:
          version: ${{ needs.plan.outputs.version }}
          marketing: ${{ needs.plan.outputs.marketing }}
          build: ${{ needs.plan.outputs.build }}

  # 打包、带上同版本的 iPad 外壳、冒烟测试；不在 dev 也不是 tag 时接着演练发布。全在一台机器上：
  # macOS 机器每排一次队要等 0、5 或 10 分钟（docs/backlog/004），串起来的 macOS job 越少越快
  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    # 只出 Apple 芯片的包。macos-14 上的 job 一启动就被取消（2026-11-19 连续两次，没有日志）；
    # macos-26 和 iPad 外壳要的 Xcode 一致，排队也最短
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # 不能叫 ZIP：Info-ZIP 的 zip 会把环境变量 ZIP 当成命令行选项（编 IPA 时用到 zip）
      MAC_ZIP: Whiteboard-${{ needs.plan.outputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 写入版本号
        run: >-
          python packaging/set_version.py "$VERSION"
          --build "${{ needs.plan.outputs.build }}" --channel "${{ needs.plan.outputs.channel }}"

      # 从锁文件装（应用依赖 + PyInstaller + cryptography），同一个提交每次打包装的版本都一样
      - name: 装依赖
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 记下装了哪些版本
        run: |
          python -m pip freeze --all | tee pip-freeze.txt
          {
            echo "### 打包用的 Python 依赖（requirements.lock）"
            echo ""
            echo "$(python --version)，requirements.lock 的 sha256 \`$(shasum -a 256 requirements.lock | cut -c1-12)\`"
            echo ""
            echo "<details><summary>pip freeze（$(wc -l < pip-freeze.txt | tr -d ' ') 个）</summary>"
            echo ""
            echo '```'
            cat pip-freeze.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成图标
        run: python packaging/make_icns.py packaging/whiteboard.icns

      # 每个版本的 Mac 应用都自带同版本的外壳，iPad 从这台 Mac 上安装和更新
      - uses: ./.github/actions/ipad-shell
        id: ipad
        with:
          version: ${{ needs.plan.outputs.version }}
          marketing: ${{ needs.plan.outputs.marketing }}
          build: ${{ needs.plan.outputs.build }}
      - run: mkdir -p packaging/ipad && cp "${{ steps.ipad.outputs.ipa }}" packaging/ipad/Whiteboard.ipa

      - uses: actions/cache@v4
        with:
          path: build/sparkle
          key: sparkle-${{ hashFiles('packaging/fetch_sparkle.sh') }}
      - run: packaging/fetch_sparkle.sh build/sparkle

      - name: 打包
        env:
          WHITEBOARD_VERSION: ${{ needs.plan.outputs.version }}
          WHITEBOARD_BUILD: ${{ needs.plan.outputs.build }}
          WHITEBOARD_CHANNEL: ${{ needs.plan.outputs.channel }}
          SPARKLE_FEED_URL: ${{ needs.plan.outputs.site }}/appcast.xml
        run: |
          # 公钥是公开的，放在仓库里（packaging/sparkle-public-key.txt）；没有这个文件时打出的包不启用 Sparkle
          SPARKLE_PUBLIC_ED_KEY="$(tr -d '[:space:]' < packaging/sparkle-public-key.txt 2>/dev/null || true)"
          export SPARKLE_PUBLIC_ED_KEY
          pyinstaller --noconfirm --clean packaging/whiteboard.spec

      - run: packaging/embed_sparkle.sh dist/Whiteboard.app build/sparkle

      - name: 导入签名证书（有的话）
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: packaging/import_cert.sh

      - name: 签名
        # 没有证书时 ad hoc；不签的话 Apple 芯片上会直接被拒绝运行
        run: packaging/sign_app.sh dist/Whiteboard.app

      - name: 冒烟测试：服务端、文档板、iPad 外壳
        run: |
          dist/Whiteboard.app/Contents/MacOS/Whiteboard --headless --no-mdns --port 8877 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8877/api/info > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "${ok:-0}" = "1" ]; then
            python packaging/smoke_doc.py http://127.0.0.1:8877 || doc_ok=0
            python packaging/smoke_ipad.py http://127.0.0.1:8877 packaging/ipad/Whiteboard.ipa || ipad_ok=0
          fi
          kill $pid || true
          test "${ok:-0}" = "1" || { echo "打出来的应用起不来"; exit 1; }
          test "${doc_ok:-1}" = "1" || { echo "打包后的文档板不可用"; exit 1; }
          test "${ipad_ok:-1}" = "1" || { echo "打包后的应用没带上 iPad 外壳"; exit 1; }

      - name: 冒烟测试：Sparkle 能加载，配置齐全
        env:
          FEED_URL: ${{ needs.plan.outputs.site }}/appcast.xml
        run: |
          if [ -s packaging/sparkle-public-key.txt ]; then export EXPECT_FEED=true; else export EXPECT_FEED=false; fi
          dist/Whiteboard.app/Contents/MacOS/Whiteboard --check-updater | tail -n 1 > updater.json
          cat updater.json
          python - <<'PY'
          import json, os
          info = json.load(open("updater.json"))
          problems = []
          if not info.get("loaded") or not info.get("controller_class"):
              problems.append(f"Sparkle.framework 没能加载：{info.get('error')}")
          if info.get("version") != os.environ["VERSION"]:
              problems.append(f"版本号是 {info.get('version')}，应为 {os.environ['VERSION']}")
          if os.environ["EXPECT_FEED"] == "true":
              if info.get("updater") != "sparkle" or info.get("feed") != os.environ["FEED_URL"]:
                  problems.append(f"Sparkle 配置不对：{info.get('updater')} {info.get('feed')}")
          else:
              print("::notice::仓库里还没有 packaging/sparkle-public-key.txt：这个包不带 Sparkle 配置，不会自动更新")
          for problem in problems:
              print(f"::error::{problem}")
          raise SystemExit(1 if problems else 0)
          PY

      - name: 压缩
        run: ditto -c -k --sequesterRsrc --keepParent dist/Whiteboard.app "$MAC_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-macos-arm64
          path: ${{ env.MAC_ZIP }}
          if-no-files-found: error

      # 不在 dev 也不是 tag：演练发布，不发布任何东西（第 3.4 节）
      # cryptography 已经随 requirements.lock 装好
      - name: 演练：生成 appcast 和增量包，核对签名，应用增量包
        if: needs.plan.outputs.publish == 'dry-run'
        run: |
          packaging/delta_dry_run.sh "$MAC_ZIP" build/sparkle "$RUNNER_TEMP/dry-run" | tee dry-run.log
          echo "### 发布演练" >> "$GITHUB_STEP_SUMMARY"
          grep -E "增量包可用|核对了|逐项一致" dry-run.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  # Edge / Chrome 插件（docs/sketch.md）：解压后在扩展页面「加载解压缩的扩展」
  extension:
    needs: plan
    if: needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 打包插件
        run: |
          python3 -c "import json; json.load(open('extensions/sketch/manifest.json'))"
          (cd extensions && zip -r -X "../Whiteboard-sketch-extension-${{ needs.plan.outputs.version }}.zip" sketch)
      - uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-sketch-extension
          path: Whiteboard-sketch-extension-*.zip
          if-no-files-found: error

  # dev → alpha，tag → stable：等所有检查都通过，再把 appcast 和更新包发布到 GitHub Pages
  updates:
    needs: [plan, checks, unit, e2e, webkit, js, inksync, ipad, package, extension]
    if: >-
      always()
      && (needs.plan.outputs.publish == 'alpha' || needs.plan.outputs.publish == 'stable')
      && needs.package.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: pages-updates
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ needs.plan.outputs.site }}/
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read # 部署前确认 Pages 包在 API 里看得到
    env:
      SITE: ${{ needs.plan.outputs.site }}
      CHANNEL: ${{ needs.plan.outputs.publish }}
      VERSION: ${{ needs.plan.outputs.version }}
      HAS_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查密钥
        id: keys
        run: |
          if [ "$HAS_PRIVATE_KEY" = "true" ] && [ -s packaging/sparkle-public-key.txt ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::缺少 Secret SPARKLE_ED_PRIVATE_KEY 或 packaging/sparkle-public-key.txt，跳过发布"
          echo "### 更新没有发布" >> "$GITHUB_STEP_SUMMARY"
          echo "缺少 Secret \`SPARKLE_ED_PRIVATE_KEY\` 或文件 \`packaging/sparkle-public-key.txt\`，见 docs/design/ci-and-updates.zh-CN.md 第 4 节。" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          name: Whiteboard-macos-arm64
          path: new
      - uses: actions/cache@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          path: build/sparkle
          key: sparkle-${{ hashFiles('packaging/fetch_sparkle.sh') }}
      - if: steps.keys.outputs.ok == 'true'
        run: packaging/fetch_sparkle.sh build/sparkle
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # 和打包同一份锁文件：cryptography 的版本和演练时一样
      - if: steps.keys.outputs.ok == 'true'
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 取线上的 appcast 和完整包
        if: steps.keys.outputs.ok == 'true'
        run: |
          python3 packaging/appcast.py fetch "$SITE" site
          cp new/*.zip site/

      - name: 写更新说明
        if: steps.keys.outputs.ok == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          zip_name="$(basename new/*.zip)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 packaging/release_notes.py "$GITHUB_REF_NAME" > notes.md || echo "- $VERSION" > notes.md
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git log --no-merges --format='- %s' "$BEFORE..$GITHUB_SHA" | head -n 30 > notes.md
          else
            git log -1 --format='- %s' > notes.md
          fi
          cat notes.md
          python3 packaging/appcast.py notes site "$zip_name" notes.md

      - name: 生成 appcast 和增量包
        if: steps.keys.outputs.ok == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          channel_args=()
          if [ "$CHANNEL" = "alpha" ]; then channel_args=(--channel alpha); fi
          # 私钥经标准输入传入，不落盘、不进日志
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | build/sparkle/bin/generate_appcast \
            --ed-key-file - "${channel_args[@]}" \
            --maximum-versions 3 --maximum-deltas 3 --embed-release-notes \
            --download-url-prefix "$SITE/" site
          python3 packaging/appcast.py prune site
          python3 packaging/appcast.py index site
          ls -l site

      - name: 核对签名
        if: steps.keys.outputs.ok == 'true'
        run: python3 packaging/appcast.py verify site packaging/sparkle-public-key.txt

      # Pages 包按这次运行的第几次尝试命名：重跑失败的 job 时，上一次上传的包还在同一个运行里，
      # 同名的话 deploy-pages 会因为「找到两个 github-pages」直接失败，重跑永远过不去
      - uses: actions/upload-pages-artifact@v3
        if: steps.keys.outputs.ok == 'true'
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # 刚上传的包要过一会儿才在 API 里列得出来；deploy-pages 只查一次，查不到就失败
      # （2026-11-25 dev 上遇到过两次）。按名字过滤的查询早就看得到时，不过滤的列表（deploy-pages
      # 查的就是它）可能还没有：所以等的是不过滤的列表，而且要连着看到三次
      - name: 等 Pages 包在 API 里出现
        if: steps.keys.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          seen=0
          for i in $(seq 1 40); do
            n="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$NAME\")] | length")"
            if [ "$n" = "1" ]; then seen=$((seen + 1)); else seen=0; fi
            [ "$seen" -ge 3 ] && exit 0
            echo "第 $i 次：列表里 $NAME 有 $n 个（连续看到 $seen 次），3 秒后再看"
            sleep 3
          done
          echo "等了 2 分钟，列表里还是看不稳 $NAME，照样去部署（部署本身还会重试）" >&2
      # 部署还查不到就隔一会儿再试，最多三次
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.keys.outputs.ok == 'true'
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 部署没成，30 秒后再试
        if: steps.keys.outputs.ok == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deploy2
        if: steps.keys.outputs.ok == 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 又没成，90 秒后最后试一次
        if: steps.keys.outputs.ok == 'true' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - uses: actions/deploy-pages@v4
        if: steps.keys.outputs.ok == 'true' && steps.deploy2.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 摘要
        if: steps.keys.outputs.ok == 'true'
        run: |
          echo "### 已发布 $CHANNEL：$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -l site | awk 'NR>1 {printf "- %s（%.1f MB）\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"

  # 正式版照常发 GitHub Release：第一次下载用，也让只有旧更新器的 1.2.0 能升级上来（第 3.7 节）
  release:
    needs: [plan, updates]
    if: always() && github.ref_type == 'tag' && needs.updates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 应用里的更新对话框显示的就是 Release 的说明，所以从 CHANGELOG.md 取这个版本的那一节
      - name: 取更新说明
        id: notes
        run: |
          if python3 packaging/release_notes.py "$GITHUB_REF_NAME" > notes.md; then
            echo "args=--notes-file notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "args=--generate-notes" >> "$GITHUB_OUTPUT"
          fi
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            ${{ steps.notes.outputs.args }} $prerelease
