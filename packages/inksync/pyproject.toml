[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inksync"
version = "0.1.0"
description = "Sync server for the handwriting pad: board storage, operation log and WebSocket protocol"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[tool.setuptools]
packages = ["inksync"]
