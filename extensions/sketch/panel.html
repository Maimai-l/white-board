<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>速写</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <iframe id="sketch" title="速写" allow="clipboard-write; clipboard-read" hidden></iframe>
  <section id="offline" hidden>
    <h1>白板应用没有运行</h1>
    <p>速写要连接 Mac 上的白板应用。打开白板应用之后，这里会自动连接。</p>
    <p class="muted" id="address"></p>
    <button id="retry">重试</button>
  </section>
  <details id="settings">
    <summary>设置</summary>
    <label>白板应用的端口 <input id="port" type="number" min="1" max="65535" step="1"></label>
    <button id="save">保存</button>
  </details>
  <script src="panel.js"></script>
</body>
</html>
