<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>刷题示例</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, "PingFang SC", sans-serif; }
    body { margin: 0; background: #f3f1f6; color: #1b1b1f; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
    main { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
    #pad { height: 65vh; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    nav, .bar { display: flex; flex-wrap: wrap; gap: 8px; }
    button { padding: 8px 14px; border: 1px solid #c8c5d0; border-radius: 8px; background: #fff; font: inherit; }
    button[aria-pressed="true"] { border-color: #3a62d7; color: #3a62d7; }
    .status { font-size: 13px; color: #5f5e66; }
  </style>
</head>
<body>
  <header>
    <h1>刷题示例</h1>
    <span class="status" id="status"></span>
  </header>
  <main>
    <nav>
      <button data-q="1" aria-pressed="true">第 1 题</button>
      <button data-q="2" aria-pressed="false">第 2 题</button>
    </nav>
    <div id="pad"></div>
    <div class="bar">
      <button id="undo">撤销</button>
      <button id="clear">清空</button>
      <span class="status" id="score"></span>
    </div>
  </main>
  <script type="module">
    import { createInkPad } from "/inksync/inkpad.js";

    // 用户在服务端的 Cookie 里；页面上的白板 id 也带着它，规则据此只放行自己的白板
    const { id: uid } = await (await fetch("/whoami")).json();
    const question = (n) => ({
      name: `第 ${n} 题`,
      canvas: { mode: "fixed", width: 800, height: 1100 },
      background: { pattern: "blank" },
      layers: [{ src: `/static/q${n}.svg`, x: 0, y: 0, width: 800, height: 240 }],
      data: { question: n },
    });

    const pad = createInkPad(document.getElementById("pad"), {
      board: `u${uid}-q1`,
      create: question(1),
    });
    const names = { online: "已同步", syncing: "同步中", offline: "未连接" };
    pad.on("status", (s) => (document.getElementById("status").textContent = names[s] || ""));
    pad.on("meta", (meta) => {
      const score = meta.data && meta.data.score;
      document.getElementById("score").textContent = score === undefined ? "" : `得分 ${score}`;
    });
    pad.on("error", ({ reason }) => (document.getElementById("status").textContent = `打不开：${reason}`));
    for (const button of document.querySelectorAll("[data-q]")) {
      button.addEventListener("click", async () => {
        const n = Number(button.dataset.q);
        await pad.open(`u${uid}-q${n}`, { create: question(n) });
        for (const other of document.querySelectorAll("[data-q]")) {
          other.setAttribute("aria-pressed", String(other === button));
        }
      });
    }
    document.getElementById("undo").addEventListener("click", () => pad.undo());
    document.getElementById("clear").addEventListener("click", () => pad.clear());
    window.pad = pad;
    window.uid = uid;
  </script>
</body>
</html>
