<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>手写板示例</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, "PingFang SC", sans-serif; }
    body { margin: 0; background: #f3f1f6; color: #1b1b1f; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
    header a { color: #3a62d7; text-decoration: none; }
    main { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
    #pad { height: 60vh; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .bar button {
      padding: 8px 14px; border: 1px solid #c8c5d0; border-radius: 8px;
      background: #fff; font: inherit; color: inherit;
    }
    .bar button[aria-pressed="true"] { border-color: #3a62d7; color: #3a62d7; }
    .bar button:disabled { opacity: .4; }
    label { display: flex; align-items: center; gap: 8px; }
    input { flex: 1; padding: 8px 10px; border: 1px solid #c8c5d0; border-radius: 8px; font: inherit; }
    .status { font-size: 13px; color: #5f5e66; }
  </style>
</head>
<body>
  <header>
    <h1>手写板示例</h1>
    <span class="status" id="status"></span>
    <a href="/?home=whiteboard">白板</a>
  </header>
  <main>
    <div id="pad"></div>
    <div class="bar">
      <button data-tool="pen" aria-pressed="true">钢笔</button>
      <button data-tool="eraser" aria-pressed="false">橡皮擦</button>
      <button id="undo" disabled>撤销</button>
      <button id="redo" disabled>重做</button>
      <button id="clear">清空</button>
    </div>
    <label>答案 <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  </main>
  <script type="module">
    import { createInkPad } from "/sdk/inkpad.js";

    // 每道题一块白板：board 相同就是同一块，Mac 上可以在「示例」文件夹里看到
    const pad = createInkPad(document.getElementById("pad"), {
      app: "demo",
      board: "demo-q1",
      name: "示例 第 1 题",
      folder: "示例",
      underlay: { src: "/apps/demo/question.svg", width: 800 },
    });

    const names = { online: "已同步", syncing: "同步中", offline: "未连接" };
    pad.on("status", (status) => (document.getElementById("status").textContent = names[status] || ""));
    pad.on("history", ({ undo, redo }) => {
      document.getElementById("undo").disabled = !undo;
      document.getElementById("redo").disabled = !redo;
    });

    for (const button of document.querySelectorAll("[data-tool]")) {
      button.addEventListener("click", () => {
        pad.setTool({ ...pad.tool, tool: button.dataset.tool });
        for (const other of document.querySelectorAll("[data-tool]")) {
          other.setAttribute("aria-pressed", String(other === button));
        }
      });
    }
    document.getElementById("undo").addEventListener("click", () => pad.undo());
    document.getElementById("redo").addEventListener("click", () => pad.redo());
    document.getElementById("clear").addEventListener("click", () => pad.clear());

    window.pad = pad; // 端到端测试用
  </script>
</body>
</html>
